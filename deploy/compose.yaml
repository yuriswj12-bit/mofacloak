# Linux only. Host networking keeps the existing loopback-only proxy trust boundary.
# Portal binds 127.0.0.1:8788; epusdt publishes 127.0.0.1:8000 only.
name: mofacloak
services:
  portal:
    build:
      context: ../web
    restart: unless-stopped
    stop_grace_period: 30s
    network_mode: host
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, node, server/healthcheck.mjs]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - ../web/data:/app/data
      - ./config:/app/config:ro
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  epusdt:
    image: gmwallet/epusdt:latest@sha256:9d2fef82fb875e83f968870bee010ce593ef7bcb5362d09ef1c7f871fa27c55e
    restart: unless-stopped
    environment:
      EPUSDT_CONFIG: /data/.env
    ports:
      - 127.0.0.1:8000:8000
    volumes:
      - ./data/gmpay:/data
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  caddy:
    image: caddy:2@sha256:ce773ec7a742ce15ee6bf2bb5f65882b9e2a4487b10733e6f1484f86e6b5d8bc
    restart: unless-stopped
    network_mode: host
    environment:
      PORTAL_DOMAIN: ${PORTAL_DOMAIN:?Set PORTAL_DOMAIN in deploy/.env}
      PAY_DOMAIN: ${PAY_DOMAIN:?Set PAY_DOMAIN in deploy/.env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in deploy/.env}
    volumes:
      - ./config:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
volumes:
  caddy_data:
  caddy_config:
